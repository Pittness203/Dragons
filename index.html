<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scopone Scientifico Online</title>
<style>
:root{--hw:64px;--tw:58px;--a:#f5c542;--b:#5ec8e8;--ink:#fdf6e3;--panel:rgba(5,35,24,.88)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#073b27;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{min-height:100dvh}
.felt{background:radial-gradient(ellipse at 50% 40%,#17835a,#0b4f33 60%,#06301f)}
button,input,select{font:inherit;color:inherit}
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{width:100%;max-width:420px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.panel.wide{max-width:640px}
h1{font-size:1.5rem;text-align:center}
h2{font-size:1.1rem}
.sub{text-align:center;opacity:.75;font-size:.9rem;margin-bottom:4px}
label{font-size:.8rem;opacity:.75;margin-top:4px}
input,select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--a)}
select option{color:#111}
.row{display:flex;gap:8px;align-items:center}
.btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.primary{background:linear-gradient(180deg,#f7d160,#e0a81d);color:#2b1d00;border-color:#b68512}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.or{text-align:center;opacity:.6;font-size:.8rem;margin:4px 0}
.foot{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:.85rem}
.foot a{cursor:pointer;opacity:.7;text-decoration:underline}
.hint{font-size:.78rem;opacity:.65;line-height:1.4}
code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px}
/* lobby */
.roomcode{font-size:2.4rem;font-weight:800;letter-spacing:.35em;text-align:center;color:var(--a);padding-left:.35em}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;border:2px solid}
.team.t0{border-color:var(--a);background:rgba(245,197,66,.08)}
.team.t1{border-color:var(--b);background:rgba(94,200,232,.08)}
.team h3{font-size:.85rem;text-align:center;opacity:.9}
.slot{min-height:54px;border-radius:10px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;flex-wrap:wrap;position:relative}
.slot small{opacity:.6}
.slot .x{position:absolute;top:4px;right:6px;background:none;border:0;cursor:pointer;opacity:.6}
.slot .x:hover{opacity:1}
/* game */
.game{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 10px;background:rgba(0,0,0,.35)}
.tm{padding:4px 10px;border-radius:10px;border:2px solid transparent;min-width:0}
.tm.t0{border-color:var(--a)}.tm.t1{border-color:var(--b)}
.tm:not(.mine){opacity:.8}
.tm .lbl{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .pts{font-size:1.6rem;font-weight:800;line-height:1}
.tm small{font-size:.7rem;opacity:.75}
.tm.t1{text-align:right}
.midinfo{text-align:center;font-size:.75rem;opacity:.85;display:flex;flex-direction:column;gap:4px;align-items:center}
.midinfo .links{display:flex;gap:10px}
.midinfo a{cursor:pointer;text-decoration:underline;opacity:.8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e55;margin-right:4px}
.dot.ok{background:#4d4}
.arena{display:grid;grid-template-columns:minmax(54px,96px) 1fr minmax(54px,96px);grid-template-rows:auto 1fr;grid-template-areas:". top ." "left tbl right";min-height:0;padding:6px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:12px;transition:.2s}
.seat.turn{background:rgba(255,255,255,.12);box-shadow:0 0 0 2px #fff7,0 0 18px rgba(255,255,255,.35)}
.seat .nm{font-size:.78rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.t0 .nm{color:var(--a)}.seat.t1 .nm{color:var(--b)}
.dl{background:#fff;color:#222;border-radius:4px;padding:0 4px;font-size:.65rem;margin-left:3px}
.seat.top{grid-area:top}.seat.left{grid-area:left;justify-content:center}.seat.right{grid-area:right;justify-content:center}
.backs{display:flex}
.backs.top .card{margin-left:-18px}.backs.top .card:first-child{margin-left:0}
.backs.left,.backs.right{flex-direction:column;align-items:center}
.backs.left .card,.backs.right .card{margin-top:-34px}.backs.left .card:first-child,.backs.right .card:first-child{margin-top:0}
.tblwrap{grid-area:tbl;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;padding:4px}
.table{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:12px;min-height:calc(var(--tw)*1.5 + 24px);width:100%;border-radius:20px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.table .card{--cw:var(--tw)}
.empty{opacity:.45;align-self:center;font-size:.85rem}
.log{font-size:.8rem;text-align:center;min-height:3.6em;line-height:1.3}
.log div{opacity:.55}.log div:first-child{opacity:1;font-weight:600}
.mezone{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 6px 10px}
.status{font-size:.9rem;font-weight:700;min-height:1.3em}
.status.you{color:#ffe27a;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
.hand{display:flex;justify-content:center;padding:6px 4px}
.hand .card{--cw:var(--hw);margin-left:calc(var(--hw)*-.28);cursor:pointer}
.hand .card:first-child{margin-left:0}
.hand.myturn .card:hover{transform:translateY(-16px);z-index:5}
.hand:not(.myturn) .card{filter:brightness(.8) drop-shadow(0 2px 3px rgba(0,0,0,.45));cursor:default}
/* cards */
.card{width:var(--cw);height:calc(var(--cw)*1.435);flex:none;position:relative;border-radius:8px;transition:transform .15s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}

<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================  CONFIGURAZIONE  =====================
// Puoi incollare qui URL e chiave anon di Supabase, oppure inserirli
// dalla schermata "Impostazioni server" (vengono salvati nel browser).
const SUPABASE_URL = 'https://jozzpsuxfrgzdgrvibxh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3TW0LmIj_jY4m_chg8yF7w_grwHr7ZQ';
const TABLE = 'scopone_rooms';

// ==ENGINE START==
// ===================  MOTORE DI GIOCO (puro)  ===================
// Carta: id 0..39. seme = floor(id/10) (0 Denari, 1 Coppe, 2 Spade, 3 Bastoni), valore = id%10+1
const SUIT_NAMES=['Denari','Coppe','Spade','Bastoni'];
const RANK_NAMES=['','Asso','Due','Tre','Quattro','Cinque','Sei','Sette','Fante','Cavallo','Re'];
const PRIME_VAL={1:16,2:12,3:13,4:14,5:15,6:18,7:21,8:10,9:10,10:10};
const SETTEBELLO=6; // 7 di Denari
const rankOf=id=>id%10+1, suitOf=id=>Math.floor(id/10), teamOf=s=>s%2;
const cardName=id=>RANK_NAMES[rankOf(id)]+' di '+SUIT_NAMES[suitOf(id)];
const clone=o=>JSON.parse(JSON.stringify(o));

function rndInt(n){
  if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
  return Math.floor(Math.random()*n);
}
function shuffledDeck(){
  const d=[...Array(40).keys()];
  for(let i=39;i>0;i--){const j=rndInt(i+1);[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
const sortHand=h=>h.sort((a,b)=>suitOf(a)-suitOf(b)||rankOf(a)-rankOf(b));

function initialState(me){
  return {phase:'lobby',players:[{id:me.id,name:me.name},null,null,null],
    settings:{target:21,napola:false},dealer:0,hands:[[],[],[],[]],table:[],
    captured:[[],[]],scope:[0,0],turn:0,plays:0,handNo:0,scores:[0,0],
    lastMove:null,lastCapturer:null,result:null,winner:null,log:[]};
}

// Distribuisce 10 carte a testa, nessuna sul tavolo. Inizia chi sta a destra del mazziere (seat+1, senso antiorario).
function startHand(s,rotate){
  if(rotate) s.dealer=(s.dealer+1)%4;
  const d=shuffledDeck();
  s.hands=[0,1,2,3].map(i=>sortHand(d.slice(i*10,i*10+10)));
  s.table=[];s.captured=[[],[]];s.scope=[0,0];s.plays=0;
  s.turn=(s.dealer+1)%4;s.lastMove=null;s.lastCapturer=null;s.result=null;
  s.phase='playing';s.handNo=(s.handNo||0)+1;s.log=[];
  return s;
}

// Prese possibili: se c'è una carta di pari valore sul tavolo si DEVE prendere quella (una sola);
// altrimenti qualunque combinazione di carte la cui somma è uguale al valore giocato.
function captureOptions(table,card){
  const r=rankOf(card);
  const same=table.filter(c=>rankOf(c)===r);
  if(same.length) return same.map(c=>[c]);
  const out=[],n=table.length,vals=table.map(rankOf);
  (function rec(i,sum,pick){
    if(pick.length&&sum===r){out.push(pick.map(k=>table[k]));return;}
    if(sum>=r) return;
    for(let k=i;k<n;k++) rec(k+1,sum+vals[k],[...pick,k]);
  })(0,0,[]);
  return out;
}
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));

// Esegue una giocata sullo stato (muta s). Ritorna {ok:true} oppure {err:'...'}.
function applyPlay(s,seat,card,take){
  if(s.phase!=='playing') return {err:'La mano non è in corso'};
  if(s.turn!==seat) return {err:'Non è il tuo turno'};
  if(!s.hands[seat].includes(card)) return {err:'Carta non in mano'};
  const opts=captureOptions(s.table,card);
  if(opts.length){ if(!opts.some(o=>sameSet(o,take))) return {err:'Presa non valida'}; }
  else if(take.length) return {err:'Presa non valida'};
  s.hands[seat]=s.hands[seat].filter(c=>c!==card);
  s.plays++;
  const team=teamOf(seat);
  let scopa=false;
  if(opts.length){
    s.table=s.table.filter(c=>!take.includes(c));
    s.captured[team].push(card,...take);
    s.lastCapturer=seat;
    // la scopa dell'ultima giocata della mano non vale
    if(s.table.length===0&&s.plays<40){s.scope[team]++;scopa=true;}
  } else s.table.push(card);
  s.lastMove={seat,card,take:[...take],scopa};
  s.log.unshift(s.lastMove); if(s.log.length>12) s.log.pop();
  if(s.plays===40) return finishHand(s);
  s.turn=(seat+1)%4;
  return {ok:true};
}

function finishHand(s){
  if(s.lastCapturer!==null&&s.table.length){s.captured[teamOf(s.lastCapturer)].push(...s.table);s.table=[];}
  s.result=scoreHand(s.captured,s.scope,s.settings);
  s.scores[0]+=s.result.total[0];s.scores[1]+=s.result.total[1];
  if(Math.max(...s.scores)>=s.settings.target&&s.scores[0]!==s.scores[1]){
    s.phase='over';s.winner=s.scores[0]>s.scores[1]?0:1;
  } else s.phase='handover';
  s.turn=-1;
  return {ok:true};
}

// Conteggio punti: carte, denari, settebello, primiera (+ napola opzionale) + scope
function scoreHand(cap,scope,st){
  const T=[0,1].map(t=>{
    const c=cap[t],best=[0,0,0,0];
    c.forEach(id=>{const su=suitOf(id);best[su]=Math.max(best[su],PRIME_VAL[rankOf(id)]);});
    const den=c.filter(id=>suitOf(id)===0).map(rankOf);
    let nap=0;
    if(st.napola&&[1,2,3].every(r=>den.includes(r))){nap=3;while(nap<10&&den.includes(nap+1))nap++;}
    return {n:c.length,den:den.length,sette:c.includes(SETTEBELLO),best,
      all4:best.every(v=>v>0),prime:best.reduce((a,b)=>a+b,0),nap,scope:scope[t]};
  });
  const [a,b]=T;
  let pw=-1;
  if(a.all4&&!b.all4) pw=0; else if(b.all4&&!a.all4) pw=1;
  else if(a.all4&&b.all4){ if(a.prime>b.prime)pw=0; else if(b.prime>a.prime)pw=1; }
  else { let sa=0,sb=0; for(let i=0;i<4;i++) if(a.best[i]&&b.best[i]){sa+=a.best[i];sb+=b.best[i];} if(sa>sb)pw=0; else if(sb>sa)pw=1; }
  const cmp=(x,y)=>[x>y?1:0,y>x?1:0];
  const rows=[];
  let p=cmp(a.n,b.n);     rows.push({label:'Carte',a:a.n,b:b.n,pa:p[0],pb:p[1]});
  p=cmp(a.den,b.den);     rows.push({label:'Denari',a:a.den,b:b.den,pa:p[0],pb:p[1]});
  rows.push({label:'Settebello',a:a.sette?'✔':'—',b:b.sette?'✔':'—',pa:a.sette?1:0,pb:b.sette?1:0});
  rows.push({label:'Primiera',a:a.prime+(a.all4?'':'*'),b:b.prime+(b.all4?'':'*'),pa:pw===0?1:0,pb:pw===1?1:0});
  if(st.napola&&(a.nap||b.nap)) rows.push({label:'Napola',a:a.nap||'—',b:b.nap||'—',pa:a.nap,pb:b.nap});
  rows.push({label:'Scope',a:a.scope,b:b.scope,pa:a.scope,pb:b.scope});
  const total=[rows.reduce((x,r)=>x+r.pa,0),rows.reduce((x,r)=>x+r.pb,0)];
  return {rows,total};
}

// ----- Bot semplice (euristico) -----
function evalMove(s,card,take){
  let v=Math.random()*1.5;
  const after=s.table.filter(c=>!take.includes(c));
  if(!take.length) after.push(card);
  if(take.length){
    const taken=[card,...take];
    v+=taken.length*3;
    taken.forEach(c=>{if(c===SETTEBELLO)v+=60;if(suitOf(c)===0)v+=4;v+=PRIME_VAL[rankOf(c)]/6;});
    if(after.length===0&&s.plays<39) v+=45;
  } else {
    v-=3;
    if(card===SETTEBELLO)v-=80;
    if(suitOf(card)===0)v-=7;
    v-=PRIME_VAL[rankOf(card)]/4;
  }
  const sum=after.reduce((x,c)=>x+rankOf(c),0);
  if(after.length&&sum<=10) v-=12; // l'avversario potrebbe fare scopa
  return v;
}
function botMove(s,seat){
  let best=null;
  for(const card of s.hands[seat]){
    const opts=captureOptions(s.table,card);
    for(const take of (opts.length?opts:[[]])){
      const sc=evalMove(s,card,take);
      if(!best||sc>best.sc) best={card,take,sc};
    }
  }
  return best;
}

function applyRow(row){
  if(room&&room.code===row.code&&row.version<=room.version) return;
  room={code:row.code,version:row.version,state:row.state};
  ui.chooser=null;
  render();botTick();
}
async function poll(){
  if(!room||!sb) return;
  const {data}=await sb.from(TABLE).select('*').eq('code',room.code).maybeSingle();
  if(data&&data.version>room.version) applyRow(data);
}
// Scrittura ottimistica: la mutazione viene rieseguita sullo stato più recente se qualcuno ha scritto prima.
async function commit(fn,tries=4){
  if(!room||busy) return false;
  busy=true;
  try{
    for(let i=0;i<tries;i++){
      const cur=room,ns=fn(clone(cur.state));
      if(!ns) return false;
      const {data,error}=await sb.from(TABLE).update({state:ns,version:cur.version+1,updated_at:new Date().toISOString()})
        .eq('code',cur.code).eq('version',cur.version).select().maybeSingle();
      if(error){toast('Errore di rete: '+error.message);return false;}
      if(data){applyRow(data);return true;}
      await poll();
    }
    return false;
  } finally {busy=false;}
}
function subscribe(){
  teardownChannel();
  channel=sb.channel('scopone-'+room.code)
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'code=eq.'+room.code},p=>{if(p.new&&p.new.state)applyRow(p.new);})
    .subscribe(st=>{const ok=st==='SUBSCRIBED';if(ok!==ui.conn){ui.conn=ok;const d=$('#conn');if(d)d.className='dot'+(ok?' ok':'');}});
  clearInterval(pollT);pollT=setInterval(poll,4000);
}
function teardownChannel(){if(channel&&sb){sb.removeChannel(channel);}channel=null;}
function teardown(){teardownChannel();clearInterval(pollT);clearTimeout(botTimer);room=null;ui.chooser=null;}

function botTick(){
  clearTimeout(botTimer);
  if(!room||room.state.phase!=='playing') return;
  const s=room.state,p=s.players[s.turn];
  if(!p||!p.bot||!humanDriver()) return;
  const ver=room.version;
  botTimer=setTimeout(()=>{
    if(!room||room.version!==ver) return;
    const m=botMove(room.state,room.state.turn);
    if(!m) return;
    commit(st=>{const r=applyPlay(st,st.turn,m.card,m.take);return r.err?null:st;});
  },900+Math.random()*700);
}

function readName(){
  const v=($('#name')?.value||'').trim();
  if(!v){toast('Inserisci il tuo nome');return false;}
  me.name=v;store.set('scopone_name',v);return true;
}
function ensureSb(){
  if(sb) return true;
  if(connect()) return true;
  ui.screen='cfg';render();return false;
}
async function enterRoom(row){
  room={code:row.code,version:row.version,state:row.state};
  store.set('scopone_last',row.code);
  ui.screen='room';ui.modal=null;
  subscribe();render();botTick();
}
async function createRoom(){
  if(!readName()||!ensureSb()) return;
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ';
  for(let i=0;i<6;i++){
    const code=Array.from({length:4},()=>chars[rndInt(chars.length)]).join('');
    const {data,error}=await sb.from(TABLE).insert({code,state:initialState(me),version:0}).select().single();
    if(!error) return enterRoom(data);
    if(error.code!=='23505'){toast('Errore: '+error.message+(error.code==='42P01'||/relation|schema cache/.test(error.message)?' — hai eseguito lo SQL?':''));return;}
  }
  toast('Non riesco a creare la stanza, riprova');
}
async function joinRoom(code){
  if(!readName()||!ensureSb()) return;
  code=(code||'').trim().toUpperCase();
  if(code.length!==4){toast('Il codice ha 4 lettere');return;}
  const {data,error}=await sb.from(TABLE).select('*').eq('code',code).maybeSingle();
  if(error){toast('Errore: '+error.message);return;}
  if(!data){toast('Stanza non trovata');return;}
  await enterRoom(data);
  if(seatOf()<0&&room.state.phase==='lobby'){
    await commit(st=>{
      if(st.phase!=='lobby'||st.players.some(p=>p&&p.id===me.id)) return null;
      const f=st.players.findIndex(p=>!p);
      if(f<0) return null;
      st.players[f]={id:me.id,name:me.name};return st;
    });
  }
  if(seatOf()<0) toast('Stanza piena o partita in corso: guardi da spettatore');
}
async function resumeRoom(code){
  if(!ensureSb()) return;
  const {data}=await sb.from(TABLE).select('*').eq('code',code).maybeSingle();
  if(!data){store.del('scopone_last');toast('Quella stanza non esiste più');render();return;}
  enterRoom(data);
}
async function leaveRoom(){
  if(room&&room.state.phase==='lobby'&&seatOf()>=0){
    await commit(st=>{
      const j=st.players.findIndex(p=>p&&p.id===me.id);
      if(j<0) return null;
      st.players[j]=null;return st;
    });
    if(room.state.players.every(p=>!p||p.bot)) await sb.from(TABLE).delete().eq('code',room.code);
  }
  if(room&&room.state.phase==='lobby') store.del('scopone_last');
  teardown();ui.screen='home';ui.modal=null;render();
}
async function playMine(card,take){
  const seat=seatOf();
  await commit(st=>{const r=applyPlay(st,seat,card,take);if(r.err){toast(r.err);return null;}return st;});
}
const resetToLobby=st=>{st.phase='lobby';st.scores=[0,0];st.hands=[[],[],[],[]];st.table=[];st.captured=[[],[]];st.scope=[0,0];st.result=null;st.winner=null;st.lastMove=null;st.log=[];st.turn=0;st.handNo=0;return st;};

  create:createRoom,
  join:()=>joinRoom($('#code').value),
  resume:(d)=>{if(readName())resumeRoom(d.code);},
  cfg:()=>{ui.screen='cfg';render();},
  home:()=>{ui.screen='home';render();},
  savecfg:async()=>{
    const url=$('#cfgurl').value.trim().replace(/\/+$/,''),key=$('#cfgkey').value.trim();
    if(!url||!key){toast('Inserisci URL e chiave');return;}
    store.set('scopone_url',url);store.set('scopone_key',key);sb=null;
    if(!connect()) return;
    const {error}=await sb.from(TABLE).select('code').limit(1);
    if(error){toast('Connesso, ma: '+error.message+' — hai eseguito lo SQL?');return;}
    toast('Connesso a Supabase ✔');ui.screen='home';render();
  },
  rules:()=>{ui.modal='rules';render();},
  menu:()=>{ui.modal='menu';render();},
  closemodal:()=>{ui.modal=null;render();},
  copy:(d)=>{(navigator.clipboard?navigator.clipboard.writeText(d.link):Promise.reject()).then(()=>toast('Link copiato'),()=>toast(d.link));},
  sit:(d)=>{const seat=+d.seat;commit(st=>{
    if(st.phase!=='lobby'||st.players[seat]) return null;
    const cur=st.players.findIndex(p=>p&&p.id===me.id);
    if(cur>=0){st.players[seat]=st.players[cur];st.players[cur]=null;}
    else st.players[seat]={id:me.id,name:me.name};
    return st;});},
  bot:(d)=>{const seat=+d.seat;commit(st=>{
    if(st.phase!=='lobby'||st.players[seat]) return null;
    const n=st.players.filter(p=>p&&p.bot).length+1;
    st.players[seat]={id:'bot'+seat+'_'+Date.now().toString(36),name:'Bot '+n,bot:true};return st;});},
  kick:(d)=>{const seat=+d.seat;commit(st=>{if(st.phase!=='lobby'||!st.players[seat]) return null;st.players[seat]=null;return st;});},
  start:()=>commit(st=>{
    if(st.phase!=='lobby'||st.players.some(p=>!p)) return null;
    st.scores=[0,0];st.handNo=0;st.dealer=rndInt(4);return startHand(st,false);}),
  leave:leaveRoom,
  play:(d)=>{
    const s=room.state,seat=seatOf(),card=+d.card;
    if(s.phase!=='playing'||s.turn!==seat||busy) return;
    const opts=captureOptions(s.table,card);
    if(opts.length<=1) return playMine(card,opts[0]||[]);
    ui.chooser={card,opts};render();
  },
  pick:(d)=>{const c=ui.chooser;if(!c)return;ui.chooser=null;playMine(c.card,c.opts[+d.i]);},
  cancelpick:()=>{ui.chooser=null;render();},
  next:()=>commit(st=>st.phase==='handover'?startHand(st,true):null),
  rematch:()=>commit(st=>{if(st.phase!=='over')return null;st.scores=[0,0];st.winner=null;st.handNo=0;return startHand(st,true);}),
  tolobby:()=>commit(st=>resetToLobby(st)),
  endgame:()=>{if(!confirm('Terminare la partita per tutti e tornare alla lobby?'))return;ui.modal=null;commit(st=>resetToLobby(st));},
  togglePlayed:()=>{ui.showPlayed=!ui.showPlayed;store.set('scopone_played',ui.showPlayed?'1':'0');render();}
};
const CHG={
  target:(el)=>commit(st=>{if(st.phase!=='lobby')return null;st.settings.target=+el.value;return st;}),
  napola:(el)=>commit(st=>{if(st.phase!=='lobby')return null;st.settings.napola=el.checked;return st;})
};
$('#app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const f=ACT[el.dataset.act];
  if(f) f(el.dataset,el);
});
$('#app').addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');
  if(el&&CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
});
$('#app').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='code') ACT.join(); else if(e.target.id==='name') createRoom();
});

// =====================  AVVIO  =====================
(function boot(){
  if(!connect()) ui.screen=getCfg().url&&getCfg().key?'home':'cfg';
  render();
  const r=new URLSearchParams(location.search).get('room');
  if(r&&me.name&&sb) joinRoom(r);
})();
</script>
</body>
</html>
